name: morning-briefing

on:
  schedule:
    # 08:20 KST 목표(=전날 23:20 UTC). GitHub 예약 지연을 감안해 9시보다 일찍 당김.
    # KST 아침 16,20,21,22,23,24 → 전날 UTC 15,19,20,21,22,23
    - cron: '20 23 15,19,20,21,22,23 7 *'
  workflow_dispatch: {}    # Actions 탭에서 수동 재실행 가능

permissions:
  contents: read

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 전체 히스토리 필요 (24시간 커밋 수집)

      - name: Fetch all branches
        run: git fetch --all --prune

      - name: Send briefing to Teams
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: python3 scripts/briefing.py
